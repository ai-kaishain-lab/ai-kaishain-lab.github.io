<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="author" content="会社員のAI実験室">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>誰の回答でしょう？｜会社員のAI実験室</title>
<meta name="description" content="お題にこっそり答えて、誰が書いたかを当て合う飲み会ゲーム。スマホ1台を順番に回して入力し、推理は指差しで。インストール不要で、ブラウザで開くだけ。">
<meta property="og:type" content="website">
<meta property="og:title" content="誰の回答でしょう？｜会社員のAI実験室">
<meta property="og:description" content="お題にこっそり答えて、誰が書いたかを当て合う飲み会ゲーム。スマホ1台を順番に回して入力し、推理は指差しで。インストール不要で、ブラウザで開くだけ。">
<meta property="og:url" content="https://ai-kaishain-lab.github.io/dare-no-kaito.html">
<meta property="og:image" content="https://ai-kaishain-lab.github.io/og-dare-no-kaito.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#14161f; --card:#1f2230; --line:#2e3244; --text:#f3f1ea; --sub:#9aa0b4;
    --accent:#f5b43c; --accent2:#ff7a59; --ok:#4fd1a5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% -20%,#2a2440 0%,var(--bg) 60%);
    color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:460px;margin:0 auto;min-height:100%;padding:24px 20px 40px;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column;gap:16px;animation:fade .25s ease}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:28px;line-height:1.3;letter-spacing:.02em}
  h1 span{color:var(--accent)}
  h2{font-size:20px}
  .lead{color:var(--sub);font-size:14px;line-height:1.7}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .label{font-size:12px;color:var(--sub);letter-spacing:.08em;margin-bottom:8px}
  input,textarea{
    width:100%;background:#151824;border:1px solid var(--line);border-radius:12px;
    color:var(--text);font-size:16px;padding:12px 14px;font-family:inherit;outline:none;
  }
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:110px;resize:none;line-height:1.6}
  .row{display:flex;gap:8px}
  .row input{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{background:#2a2e40;border-radius:999px;padding:8px 8px 8px 14px;font-size:14px;display:flex;align-items:center;gap:6px}
  .chip button{background:none;border:none;color:var(--sub);font-size:16px;width:24px;height:24px;cursor:pointer}
  button.btn{
    width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;
    background:var(--accent);color:#1b1608;cursor:pointer;font-family:inherit;
  }
  button.btn:disabled{opacity:.35}
  button.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
  button.btn.small{padding:12px;font-size:15px}
  button.add{border:none;border-radius:12px;background:#2a2e40;color:var(--text);font-size:15px;padding:0 16px;cursor:pointer}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:12px;padding:10px;font-size:15px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#1b1608;border-color:var(--accent);font-weight:700}
  .spacer{flex:1}
  .center{text-align:center}
  .big-emoji{font-size:64px;text-align:center;margin:12px 0}
  .who{font-size:34px;font-weight:800;text-align:center;color:var(--accent)}
  .topic{font-size:22px;font-weight:700;line-height:1.5}
  .round-tag{display:inline-block;background:#2a2e40;color:var(--accent);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
  .answer{font-size:26px;font-weight:800;line-height:1.5;text-align:center;padding:28px 12px;word-break:break-word}
  .reveal-name{font-size:30px;font-weight:800;color:var(--ok);text-align:center}
  .muted{color:var(--sub);font-size:13px;text-align:center}
  .progress{display:flex;gap:6px;justify-content:center}
  .progress i{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .progress i.done{background:var(--accent)}
  .rank{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:17px}
  .rank:last-child{border-bottom:none}
  .rank .no{width:28px;text-align:center;font-weight:800;color:var(--sub)}
  .rank.top .no{color:var(--accent)}
  .rank .nm{flex:1}
  .rank .st{color:var(--accent);font-weight:700}
  .note{font-size:12px;color:var(--sub);line-height:1.6}
  .back{color:var(--sub);font-size:13px;text-decoration:none}
  .err{color:var(--accent2);font-size:13px;min-height:18px}
  .pick{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:inherit}
  .pick.on{background:var(--ok);border-color:var(--ok);color:#0d2a20;font-weight:700}
  .gain{color:var(--ok);font-size:14px;text-align:center;min-height:20px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. セットアップ -->
  <section class="screen active" id="s-setup">
    <a class="back" href="tools.html">← 道具箱</a>
    <h1>誰の回答<span>でしょう？</span></h1>
    <p class="lead">お題に全員がこっそり答えて、あとで「誰が書いたか」を当て合うゲームです。スマホ1台を順番に回して遊べます。</p>

    <div class="card">
      <div class="label">参加者（3〜8人）</div>
      <div class="row">
        <input id="nameInput" placeholder="名前を入力" maxlength="10" enterkeyhint="done">
        <button class="add" id="addBtn">追加</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="err" id="setupErr"></div>
    </div>

    <div class="card">
      <div class="label">モード</div>
      <div class="seg" id="modeSeg">
        <button data-v="basic" class="on">基本編</button><button data-v="adv">応用編</button>
      </div>
      <p class="note" id="modeDesc" style="margin-top:10px"></p>
    </div>

    <div class="card">
      <div class="label">ラウンド数</div>
      <div class="seg" id="roundSeg">
        <button data-v="1">1</button><button data-v="2">2</button><button data-v="3" class="on">3</button><button data-v="5">5</button>
      </div>
    </div>

    <div class="spacer"></div>
    <button class="btn" id="startBtn" disabled>はじめる</button>
  </section>

  <!-- 2. お題発表 -->
  <section class="screen" id="s-topic">
    <div class="center"><span class="round-tag" id="topicRound"></span></div>
    <div class="card">
      <div class="label">今回のお題</div>
      <div class="topic" id="topicText"></div>
    </div>
    <button class="btn ghost small" id="shuffleTopic">🔀 別のお題にする</button>
    <div class="card">
      <div class="label">自分たちでお題を作る</div>
      <div class="row">
        <input id="customTopic" placeholder="例：社会人1年目の失敗談" maxlength="40">
        <button class="add" id="useCustom">決定</button>
      </div>
    </div>
    <p class="note" id="topicNote"></p>
    <div class="spacer"></div>
    <button class="btn" id="topicGo">このお題で回答スタート</button>
  </section>

  <!-- 3. 受け渡し -->
  <section class="screen" id="s-pass">
    <div class="spacer"></div>
    <div class="big-emoji">📱</div>
    <p class="muted">スマホを渡してください</p>
    <div class="who" id="passName"></div>
    <p class="muted">他の人は画面を見ないでね</p>
    <div class="progress" id="passProgress"></div>
    <div class="spacer"></div>
    <button class="btn" id="passGo">私です、回答する</button>
  </section>

  <!-- 4. 回答入力 -->
  <section class="screen" id="s-input">
    <div class="center"><span class="round-tag" id="inputWho"></span></div>
    <div class="card">
      <div class="label">お題</div>
      <div class="topic" id="inputTopic"></div>
    </div>
    <textarea id="answerInput" placeholder="ここに回答（30字くらいまでがおすすめ）" maxlength="60"></textarea>
    <div class="err" id="inputErr"></div>
    <div class="spacer"></div>
    <button class="btn" id="submitAnswer">回答して画面を隠す</button>
  </section>

  <!-- 5. 集計完了 -->
  <section class="screen" id="s-gathered">
    <div class="spacer"></div>
    <div class="big-emoji">🍻</div>
    <h2 class="center">全員の回答が集まりました</h2>
    <p class="muted">スマホをテーブルの真ん中に置いて、みんなで画面を見てください。<br>回答はシャッフルして1つずつ出てきます。</p>
    <div class="spacer"></div>
    <button class="btn" id="startReveal">推理タイム開始</button>
  </section>

  <!-- 6. 推理と正解発表 -->
  <section class="screen" id="s-reveal">
    <div class="center"><span class="round-tag" id="revealCount"></span></div>
    <div class="card">
      <div class="label" id="revealTopic"></div>
      <div class="answer" id="revealAnswer"></div>
    </div>
    <div id="guessPhase">
      <p class="muted">誰が書いたと思う？ せーので指さしてから…</p>
      <div style="height:12px"></div>
      <button class="btn" id="showAuthor">正解を見る</button>
    </div>
    <div id="judgePhase" style="display:none">
      <p class="muted">書いたのは</p>
      <div class="reveal-name" id="authorName"></div>
      <div style="height:16px"></div>
      <div id="judgeBasic">
        <p class="muted">みんな当てられた？</p>
        <div style="height:8px"></div>
        <div class="row">
          <button class="btn ghost" id="judgeHit">当てられた</button>
          <button class="btn" id="judgeMiss">外れた（★）</button>
        </div>
      </div>
      <div id="judgeAdv" style="display:none">
        <p class="muted">当てた人は手を挙げて！ その人の名前をタップ</p>
        <div class="chips" id="hitChips" style="justify-content:center"></div>
        <div style="height:12px"></div>
        <button class="btn" id="judgeAdvGo">決定</button>
      </div>
    </div>
    <div class="spacer"></div>
  </section>

  <!-- 7. 結果 -->
  <section class="screen" id="s-result">
    <h2 class="center" id="resultTitle"></h2>
    <p class="muted" id="resultLead"></p>
    <div class="card" id="ranking"></div>
    <div class="spacer"></div>
    <button class="btn" id="nextRound"></button>
    <button class="btn ghost small" id="restart" style="display:none">メンバーを変えて最初から</button>
  </section>

</div>

<script>
const TOPICS = [
  "無人島に1つだけ持っていくなら？","宝くじで1億円当たったら最初に買うもの","人生で一番高かった衝動買い",
  "子どもの頃の将来の夢","最後の晩餐に食べたいもの","一度は行ってみたい国・場所","自分を動物に例えると？",
  "密かに自慢できる特技","カラオケの十八番","コンビニおにぎりの推しの具","理想の休日の過ごし方",
  "学生時代のあだ名","最近ハマっているもの","朝起きて最初にすること","やめられない小さな癖",
  "タイムマシンで行くなら何年の何？","実はちょっと苦手な食べ物","生まれ変わったらなりたい職業",
  "最近ちょっと嬉しかったこと","スマホで一番使っているアプリ","人に話すと驚かれる経験",
  "家にある一番謎のもの","初めて自分で買ったCD・曲","理想の老後の過ごし方","飲み会の締めに食べたいもの",
  "冷蔵庫に必ず入っているもの","明日が急に休みになったら何する？","子どもの頃に一番ハマった遊び",
  "つい買ってしまうもの","人生のテーマソングにしたい曲","100万円を1日で使い切るなら？","地味に許せないこと"
];

const MODES = {
  basic:{ desc:"外れたら書いた人に★。考えずにすぐ遊べます。",
          note:"ポイント：正直に書くもよし、他の人っぽく書いて「騙す」もよし。外れたら書いた人に★が入ります。",
          lead:"★＝みんなを騙せた回数。多いほど「読めない人」です" },
  adv:  { desc:"当てた人に★1。書いた人は「一部の人だけ当てた」ときに★2（全員正解・全員ハズレは0点）。4人以上がおすすめ。",
          note:"ポイント：ベタすぎても突飛すぎても0点。「分かる人には分かる自分らしさ」を狙ってください。",
          lead:"★＝推理で当てた数＋ちょうどよく当てられた回答のボーナス" }
};
const S = { mode:"basic", hits:new Set(), players:[], rounds:3, round:0, topic:"", used:new Set(), turn:0, answers:[], order:[], idx:0, stars:{} };
const $ = id => document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0,0); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- セットアップ ---- */
function renderChips(){
  $('chips').innerHTML = S.players.map((p,i)=>`<span class="chip">${esc(p)}<button data-i="${i}" aria-label="削除">×</button></span>`).join('');
  $('startBtn').disabled = S.players.length < 3;
}
function addPlayer(){
  const v = $('nameInput').value.trim();
  $('setupErr').textContent = '';
  if(!v) return;
  if(S.players.includes(v)){ $('setupErr').textContent='同じ名前がいます（あだ名などで区別してください）'; return; }
  if(S.players.length>=8){ $('setupErr').textContent='8人までです'; return; }
  S.players.push(v); $('nameInput').value=''; renderChips(); $('nameInput').focus();
}
$('addBtn').onclick = addPlayer;
$('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addPlayer(); }});
$('chips').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; S.players.splice(+b.dataset.i,1); renderChips(); };
function renderMode(){ $('modeDesc').textContent = MODES[S.mode].desc; }
$('modeSeg').onclick = e=>{ const b=e.target.closest('button'); if(!b) return;
  [...$('modeSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); S.mode=b.dataset.v; renderMode(); };
renderMode();
$('roundSeg').onclick = e=>{ const b=e.target.closest('button'); if(!b) return;
  [...$('roundSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); S.rounds=+b.dataset.v; };
$('startBtn').onclick = ()=>{ S.round=0; S.stars={}; S.players.forEach(p=>S.stars[p]=0); S.used=new Set(); startRound(); };

/* ---- お題 ---- */
function pickTopic(){
  let pool = TOPICS.filter(t=>!S.used.has(t));
  if(!pool.length){ S.used=new Set(); pool=TOPICS.slice(); }
  S.topic = pool[Math.floor(Math.random()*pool.length)];
  $('topicText').textContent = S.topic;
}
function startRound(){
  S.round++; $('topicRound').textContent = `ROUND ${S.round} / ${S.rounds}`;
  $('customTopic').value=''; $('topicNote').textContent = MODES[S.mode].note; pickTopic(); show('s-topic');
}
$('shuffleTopic').onclick = pickTopic;
$('useCustom').onclick = ()=>{ const v=$('customTopic').value.trim(); if(v){ S.topic=v; $('topicText').textContent=v; } };
$('topicGo').onclick = ()=>{ S.used.add(S.topic); S.turn=0; S.answers=[]; S.order=shuffle(S.players); toPass(); };

/* ---- 受け渡しと回答 ---- */
function toPass(){
  const name = S.order[S.turn];
  $('passName').textContent = name + ' さん';
  $('passProgress').innerHTML = S.order.map((_,i)=>`<i class="${i<S.turn?'done':''}"></i>`).join('');
  show('s-pass');
}
$('passGo').onclick = ()=>{
  $('inputWho').textContent = S.order[S.turn] + ' さんの回答';
  $('inputTopic').textContent = S.topic;
  $('answerInput').value=''; $('inputErr').textContent='';
  show('s-input'); setTimeout(()=>$('answerInput').focus(),250);
};
$('submitAnswer').onclick = ()=>{
  const v = $('answerInput').value.trim();
  if(!v){ $('inputErr').textContent='ひとことでいいので書いてください'; return; }
  S.answers.push({ author:S.order[S.turn], text:v });
  $('answerInput').value=''; $('answerInput').blur();
  S.turn++;
  if(S.turn < S.order.length) toPass(); else show('s-gathered');
};

/* ---- 推理と発表 ---- */
$('startReveal').onclick = ()=>{ S.answers = shuffle(S.answers); S.idx=0; showAnswer(); };
function showAnswer(){
  const a = S.answers[S.idx];
  $('revealCount').textContent = `${S.idx+1} / ${S.answers.length}`;
  $('revealTopic').textContent = 'お題：' + S.topic;
  $('revealAnswer').textContent = '「' + a.text + '」';
  $('guessPhase').style.display=''; $('judgePhase').style.display='none';
  show('s-reveal');
}
$('showAuthor').onclick = ()=>{
  const author = S.answers[S.idx].author;
  $('authorName').textContent = author + ' さん';
  const adv = S.mode==='adv';
  $('judgeBasic').style.display = adv?'none':'';
  $('judgeAdv').style.display = adv?'':'none';
  if(adv){
    S.hits = new Set();
    $('hitChips').innerHTML = S.players.filter(p=>p!==author)
      .map(p=>`<button class="pick" data-n="${esc(p)}">${esc(p)}</button>`).join('');
  }
  $('guessPhase').style.display='none'; $('judgePhase').style.display='';
};
$('hitChips').onclick = e=>{ const b=e.target.closest('button'); if(!b) return;
  const n=b.dataset.n; if(S.hits.has(n)){S.hits.delete(n);b.classList.remove('on');}else{S.hits.add(n);b.classList.add('on');} };
$('judgeAdvGo').onclick = ()=>{
  const author = S.answers[S.idx].author, guessers = S.players.length-1, k = S.hits.size;
  S.hits.forEach(p=>S.stars[p]++);
  if(k>0 && k<guessers) S.stars[author]+=2;
  S.idx++;
  if(S.idx < S.answers.length) showAnswer(); else showResult();
};
function nextAnswer(miss){
  if(miss) S.stars[S.answers[S.idx].author]++;
  S.idx++;
  if(S.idx < S.answers.length) showAnswer(); else showResult();
}
$('judgeHit').onclick = ()=>nextAnswer(false);
$('judgeMiss').onclick = ()=>nextAnswer(true);

/* ---- 結果 ---- */
function showResult(){
  const last = S.round >= S.rounds;
  $('resultTitle').textContent = last ? '🏆 最終結果' : `ROUND ${S.round} 終了`;
  $('resultLead').textContent = MODES[S.mode].lead;
  const list = S.players.slice().sort((a,b)=>S.stars[b]-S.stars[a]);
  const top = S.stars[list[0]];
  $('ranking').innerHTML = list.map((p,i)=>`<div class="rank ${S.stars[p]===top&&top>0?'top':''}"><span class="no">${i+1}</span><span class="nm">${esc(p)}</span><span class="st">${S.stars[p]>5?'★×'+S.stars[p]:('★'.repeat(S.stars[p])||'－')}</span></div>`).join('');
  $('nextRound').textContent = last ? '同じメンバーでもう1回' : '次のラウンドへ';
  $('restart').style.display = last ? '' : 'none';
  show('s-result');
}
$('nextRound').onclick = ()=>{
  if(S.round >= S.rounds){ S.round=0; S.players.forEach(p=>S.stars[p]=0); }
  startRound();
};
$('restart').onclick = ()=>{ show('s-setup'); };
</script>
</body>
</html>
