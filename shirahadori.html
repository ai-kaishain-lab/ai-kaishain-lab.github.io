  <h1>真剣白刃取り</h1>
  <div class="sub">― 体 感 ―</div>
  <div class="how">
    両手の親指を左右の手に見立てて画面に置き（片手の親指と人差し指でも可）、刀が来たら<b>指を寄せて</b>挟み取れ。<br>
    早すぎても、遅すぎても斬られる。<br>
    太刀は一本ごとに速くなり、途中から<b>フェイント</b>も混じる。<br>
    最後の一太刀は、人間の反応速度より速い。<br>
    見るべきは、刀の速さだけではない。
  </div>

  [[1760,0.30,1.3],[2793,0.20,1.1],[3951,0.16,0.9],[5588,0.10,0.7],[7459,0.05,0.5]].forEach(([f,a,d])=>{
    const o=AC.createOscillator();o.type='sine';const st=t+0.035;
    o.frequency.setValueAtTime(f*1.012,st);o.frequency.exponentialRampToValueAtTime(f,st+0.25);
    const g=AC.createGain();env(g,st,a,0.008,d);o.connect(g).connect(out);o.start(st);o.stop(st+d+0.05);
  });}catch(e){}
}
function sfxCut(){ // 「ドュクシ」
  if(!AC||!soundOn)return;try{
  const t=AC.currentTime+0.01,out=AC.createGain();out.gain.value=0.8;out.connect(AC.destination);
  noiseHit(out,t,0.14,'bandpass',2600,1.2,0.45,500);            // ヒュッ（斬撃の風切り）
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t+0.02);o.frequency.exponentialRampToValueAtTime(42,t+0.3);
  const g=AC.createGain();env(g,t+0.02,0.9,0.005,0.32);o.connect(g).connect(out);o.start(t+0.02);o.stop(t+0.4);   // ドュ
  noiseHit(out,t+0.09,0.07,'bandpass',1100,1.5,0.7);            // ク
  noiseHit(out,t+0.15,0.16,'highpass',4200,0.7,0.28);           // シ
  }catch(e){}
}
$('snd').addEventListener('click',()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'音 ON':'音 OFF';initAudio();});
function startGame(){initAudio();idx=0;results=[];$('title').classList.add('hidden');$('end').classList.add('hidden');startRound();}
function startRound(){
  const cfg=ROUNDS[idx];const t0=performance.now();
  let t=t0+rand(1200,2100);const feints=[];
  for(let i=0;i<cfg.feints;i++){feints.push(t);t+=FEINT_DUR+rand(500,950);}
  const stepStart=t,swingStart=t+STEP_LEAD,impact=swingStart+cfg.swing;
  R={cfg,t0,feints,stepStart,swingStart,impact,tap:{L:null,R:null},resolved:false,outcome:null,closeT:null};
  state='round';flash=null;rebase();
  $('hudN').textContent=`${idx+1} / ${ROUNDS.length}`;$('hudName').textContent=cfg.name;
  $('hud').classList.remove('hidden');$('res').classList.add('hidden');
}
function inFeint(t){return R.feints.some(f=>t>=f&&t<=f+FEINT_DUR);}

function tap(side,t){
  if(state!=='round'||!R||R.resolved)return;
  if(R.tap[side]!==null)return;
  R.tap[side]=t;
  if(R.tap.L!==null&&R.tap.R!==null)judge();
}
function judge(){
  const a=R.tap.L,b=R.tap.R,close=Math.max(a,b);
  if(Math.abs(a-b)>SYNC)return resolve('sync',close);
  if(close<R.stepStart)return resolve(inFeint(close)?'fooled':'early',close);
  if(close<R.impact-WIN_BEFORE)return resolve('early',close);
  if(close<=R.impact+GRACE)return resolve('ok',close);
  return resolve('late',close);
}
function resolve(outcome,closeT){
  R.resolved=true;R.outcome=outcome;R.closeT=closeT;
  const reaction=closeT!=null?Math.round(closeT-R.swingStart):null;
  results.push({name:R.cfg.name,swing:R.cfg.swing,outcome,reaction});
  const now=performance.now();
  if(outcome==='ok'){flash={t:now,c:'255,255,255'};sfxOk();if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}}
  const delay=outcome==='ok'?350:Math.max(0,R.impact-now)+420;
  setTimeout(()=>showResult(outcome,reaction),delay);
}
const pts={},slide={L:0,R:0};let d0=null;
function dist(){const v=Object.values(pts);return v.length<2?null:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);}
function rebase(){d0=dist();slide.L=slide.R=0;}
function pinch(t){if(state!=='round'||!R||R.resolved)return;if(R.tap.L!==null)return;R.tap.L=R.tap.R=t;judge();}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(Object.keys(pts).length>=2)return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(Object.keys(pts).length===2)rebase();},{passive:false});
cv.addEventListener('pointermove',e=>{const p=pts[e.pointerId];if(!p)return;p.x=e.clientX;p.y=e.clientY;
  const d=dist();if(d==null||d0==null||d0<50)return;if(R&&R.tap.L!==null)return;
  const need=Math.max(30,d0*0.35);const prog=clamp((d0-d)/need,0,1);slide.L=slide.R=prog;
  if(prog>=1)pinch(stamp(e));});
function lift(e){if(!pts[e.pointerId])return;delete pts[e.pointerId];d0=null;if(!(R&&R.tap.L!==null))slide.L=slide.R=0;}
cv.addEventListener('pointerup',lift);cv.addEventListener('pointercancel',lift);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();pinch(stamp(e));}});

const MSG={
 ok:['見切った！','ok'],late:['斬られた','ng'],early:['早すぎた','ng'],
 fooled:['フェイントに釣られた','ng'],sync:['両手がそろわない','ng']
};
function showResult(outcome,reaction){
  state='result';
  const [txt,cls]=MSG[outcome];
  let ms='',note='';
  const sw=R.cfg.swing;
  if(reaction!=null&&outcome!=='sync'&&outcome!=='fooled'){
    ms=`振り出しから ${reaction} ms で挟んだ（刀が届くまで ${sw} ms）`;
  }else if(outcome==='late'){ms=`刀が届くまで ${sw} ms`;}
  if(outcome==='ok'&&reaction<150)note='見てからでは間に合わない速さ。動きを読んで受けた';
  else if(outcome==='ok')note='振り出しを見てから反応して受けた';
  else if(outcome==='late'&&sw<=200)note='見てから動いては、この速さには間に合わない';
  else if(outcome==='late')note='反応が刀に追いつかなかった';
  else if(outcome==='early')note='刀が来る前に手を閉じてしまった';
  else if(outcome==='fooled')note='振りかぶっただけ。まだ斬ってきていない';
  else if(outcome==='sync')note='2本の指でつまんでください';
  const last=idx>=ROUNDS.length-1;
  const el=$('res');
  el.innerHTML=`<div class="big ${cls}">${txt}</div>${ms?`<div class="ms">${ms}</div>`:''}${note?`<div class="note">${note}</div>`:''}<button class="primary" id="nextBtn">${last?'結果を見る':'次の太刀へ'}</button>`;
  el.classList.remove('hidden');
  const btn=$('nextBtn');btn.style.visibility='hidden';
  setTimeout(()=>{btn.style.visibility='visible';},600);
  btn.addEventListener('click',()=>{initAudio();if(last)showEnd();else{idx++;startRound();}});
}

function showEnd(){
  state='end';$('hud').classList.add('hidden');$('res').classList.add('hidden');
  const score=results.filter(r=>r.outcome==='ok').length;
  if(score>getBest())setBest(score);
  const verdict=score===5?'達人。最後の一太刀まで読み切った':score>=3?'免許皆伝まで、あと一歩':score>=1?'見てから動くと、こうなる':'人間の反応速度の壁を体感した';
  const rows=results.map(r=>`<tr><td>${r.name}</td><td class="r">${(r.swing/1000).toFixed(2)}秒</td><td>${MSG[r.outcome][0]}</td><td class="r">${r.reaction!=null?r.reaction+' ms':'―'}</td></tr>`).join('');
  const last=results[results.length-1];
  $('end').innerHTML=`<div class="wrap">
   <div class="score">${score}<small> / 5 本</small></div>
   <div class="verdict">${verdict}</div>
   <table><tr><td style="color:var(--muted)">太刀</td><td class="r" style="color:var(--muted)">速さ</td><td style="color:var(--muted)">結果</td><td class="r" style="color:var(--muted)">反応</td></tr>${rows}</table>
   <div class="sci">
     <p><span class="lb">事実</span>目で見てから指が動くまでの単純反応時間は、一般に約0.2秒前後といわれます。</p>
     <p><span class="lb">設定</span>終の太刀は、振り出しから0.18秒で届きます。見てから動くと、指が動く前に刀が届く計算です。</p>
     <p><span class="lb">仮説</span>本物の白刃取りも、刀を見て反応するのではなく、相手の踏み込みや間合いから「いつ来るか」を読む技術なのかもしれません。</p>
   </div>
   ${last.outcome!=='ok'?'<div class="hint">ヒント：本物の斬撃の前だけ、相手は<b style="color:var(--gold)">踏み込みます</b>（刀がぐっと近づき、足元に砂ぼこり）。踏み込んでから振り出すまでの間は、毎回同じです。</div>':''}
   <div class="hint" style="font-size:12px">※画面表示とタッチの検出には機種ごとに数十ms程度の遅れがあるため、数値は目安です。</div>
   <button class="primary" id="againBtn">もう一度</button>
   <button id="shareBtn">結果をシェア</button><a href="tools.html" style="margin-top:22px;color:var(--muted);font-size:14px">← 道具箱へ</a></div>`;
  $('end').classList.remove('hidden');
  $('againBtn').addEventListener('click',startGame);
  $('shareBtn').addEventListener('click',async()=>{
    const lastTxt=last.outcome==='ok'?'最後の0.18秒の太刀も見切った':'最後の0.18秒の太刀は見切れなかった';
    const text=`真剣白刃取り体感、${score}/5本。${lastTxt}。 #白刃取りチャレンジ`;
    const url=location.href;
    try{if(navigator.share){await navigator.share({text,url});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    try{await navigator.clipboard.writeText(text+' '+url);$('shareBtn').textContent='コピーしました';}catch(e){$('shareBtn').textContent='コピーできませんでした';}
  });
}
$('startBtn').addEventListener('click',startGame);

/* ---------- drawing ---------- */
let VIEW={Z:1,oy:0,ox:0};
function imgRect(){const s=Math.max(W/IMG.width,H/IMG.height);const iw=IMG.width*s,ih=IMG.height*s;return {x:(W-iw)/2,y:H-ih,iw,ih};}
function anchor(){return {x:W/2,y:H*0.45};}
function toScreen(u,v){const r=imgRect(),A=anchor();const px=r.x+u*r.iw,py=r.y+v*r.ih;return {x:A.x+(px-A.x)*VIEW.Z+VIEW.ox,y:A.y+(py-A.y)*VIEW.Z+VIEW.oy};}
function drawImg(dark,im){im=im||IMG;
  const r=imgRect(),A=anchor(),Z=VIEW.Z;
  ctx.drawImage(im,A.x+(r.x-A.x)*Z+VIEW.ox,A.y+(r.y-A.y)*Z+VIEW.oy,r.iw*Z,r.ih*Z);
  const g=ctx.createLinearGradient(0,0,0,H*0.2);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.2);
  const g2=ctx.createLinearGradient(0,H*0.62,0,H);g2.addColorStop(0,'rgba(20,17,15,0)');g2.addColorStop(1,'rgba(20,17,15,.75)');ctx.fillStyle=g2;ctx.fillRect(0,H*0.62,W,H*0.38);
  if(dark>0){ctx.fillStyle=`rgba(10,8,6,${dark})`;ctx.fillRect(0,0,W,H);}
}
function bg(){
  const g=ctx.createRadialGradient(W/2,H*0.42,10,W/2,H*0.42,Math.max(W,H)*0.8);
  g.addColorStop(0,'#3a2f26');g.addColorStop(1,'#110e0c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,H*0.64,W,H*0.36);
  ctx.strokeStyle='rgba(201,164,92,.12)';ctx.lineWidth=1;
  for(let i=1;i<6;i++){const y=H*0.64+i*i*H*0.012;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function dust(now){
  if(!R||now<R.stepStart)return;
  const k=(now-R.stepStart)/500;if(k>1)return;
  ctx.fillStyle=`rgba(201,164,92,${0.5*(1-k)})`;
  for(let i=0;i<10;i++){const s=i%2?1:-1;const f=imgOk?toScreen(0.5,FOOT_V):{x:W/2,y:H*0.64};const x=f.x+s*(45+i*10)*(1+k);const y=f.y-k*20*(i%3+1);ctx.beginPath();ctx.arc(x,y,2+i%3,0,Math.PI*2);ctx.fill();}
}
function blade(p,hilt0,handY,cl,sc){
  const e=p<=1?p*p:1+(p-1)*2.2;
  const cx=lerp(hilt0.hx,W/2,clamp(e,0,1));
  const tipY=lerp(hilt0.hy-H*0.24,handY,e);
  const hiltY=lerp(hilt0.hy,H*0.42,Math.min(e,1.25));
  const w=lerp(4,13,Math.min(e,1.3))*(sc||1);
  ctx.lineCap='butt';
  // handle
  const dir=Math.sign(tipY-hiltY)||-1;
  ctx.strokeStyle='#2b1d14';ctx.lineWidth=w*1.4;
  ctx.beginPath();ctx.moveTo(cx,hiltY);ctx.lineTo(cx,hiltY-dir*H*0.05*(1+e*0.4));ctx.stroke();
  // blade
  const g=ctx.createLinearGradient(cx-w,0,cx+w,0);
  g.addColorStop(0,'#8d979c');g.addColorStop(.5,'#f4f8fa');g.addColorStop(1,'#a9b3b8');
  ctx.strokeStyle=g;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(cx,hiltY);ctx.lineTo(cx,tipY);ctx.stroke();
  // tsuba
  ctx.fillStyle=cl;ctx.beginPath();ctx.ellipse(cx,hiltY,w*1.6,w*0.5,0,0,Math.PI*2);ctx.fill();
}
const HAND_OFF=0.055;
function handPath(u){
  // left hand seen from the thumb side (palm faces right/inward); origin ~ palm center
  ctx.beginPath();
  ctx.moveTo(-14*u,64*u);
  ctx.lineTo(-16*u,32*u);
  ctx.quadraticCurveTo(-25*u,2*u,-20*u,-30*u);
  ctx.lineTo(-12*u,-88*u);
  ctx.quadraticCurveTo(-8*u,-102*u,2*u,-101*u);
  ctx.quadraticCurveTo(13*u,-99*u,12*u,-86*u);
  ctx.lineTo(14*u,-40*u);
  ctx.quadraticCurveTo(19*u,-18*u,21*u,10*u);
  ctx.lineTo(18*u,64*u);
  ctx.closePath();
}
function thumbPath(u){
  ctx.beginPath();
  ctx.moveTo(3*u,52*u);
  ctx.quadraticCurveTo(2*u,0,7*u,-30*u);
  ctx.quadraticCurveTo(13*u,-47*u,22*u,-36*u);
  ctx.quadraticCurveTo(27*u,-12*u,23*u,28*u);
  ctx.lineTo(19*u,56*u);
  ctx.closePath();
}
function hands(handY){
  const sz=Math.min(W*0.26,115),u=sz/100,off=H*HAND_OFF;
  const inner=24*u+8;
  const sides=[['L',W*0.2,W/2-inner,handY-off,1],['R',W*0.8,W/2+inner,handY+off,-1]];
  for(const [s,ox,cxp,y,dir] of sides){
    const closed=R&&R.tap[s]!==null;
    const x=closed?cxp:lerp(ox,cxp,slide[s]*0.6);
    ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
    ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=12;
    const g=ctx.createLinearGradient(-25*u,0,22*u,0);
    g.addColorStop(0,closed?'#c9966c':'#b98a63');g.addColorStop(1,closed?'#ecc6a0':'#dcb08a');
    ctx.fillStyle=g;handPath(u);ctx.fill();
    ctx.shadowBlur=0;ctx.strokeStyle='rgba(100,60,35,.55)';ctx.lineWidth=1.4;ctx.stroke();
    // finger separations
    ctx.strokeStyle='rgba(100,60,35,.35)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-3*u,-98*u);ctx.quadraticCurveTo(-6*u,-70*u,-8*u,-45*u);
    ctx.moveTo(6*u,-96*u);ctx.quadraticCurveTo(4*u,-70*u,3*u,-50*u);ctx.stroke();
    // thumb
    const g2=ctx.createLinearGradient(3*u,0,24*u,0);
    g2.addColorStop(0,closed?'#dcae86':'#cc9f78');g2.addColorStop(1,closed?'#f3d2b0':'#e4bb95');
    ctx.fillStyle=g2;thumbPath(u);ctx.fill();
    ctx.strokeStyle='rgba(100,60,35,.55)';ctx.lineWidth=1.4;ctx.stroke();
    // thumb nail
    ctx.fillStyle='rgba(255,236,220,.75)';ctx.beginPath();
    if(ctx.ellipse)ctx.ellipse(16*u,-30*u,5*u,8*u,0.15,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}
function frame(now){
  ctx.clearRect(0,0,W,H);
  const handY=H*0.78;
  let scale=1,raise=0,p=0;
  if(R&&state!=='title'){
    if(now>=R.stepStart)scale=1+0.16*clamp((now-R.stepStart)/STEP_ANIM,0,1);
    for(const f of R.feints){if(now>=f&&now<=f+FEINT_DUR)raise=Math.sin(Math.PI*(now-f)/FEINT_DUR);}
    if(now>=R.swingStart)p=(now-R.swingStart)/R.cfg.swing;
    if(R.resolved&&R.outcome==='ok'){p=Math.min(p,1);if(now>=R.impact)p=1;}
    if(R.resolved&&R.outcome==='ok'&&now<R.impact)p=Math.min(p,1);
    p=Math.min(p,1.45);
    // auto resolve
    if(state==='round'&&!R.resolved){
      const one=R.tap.L!==null?R.tap.L:R.tap.R;
      if(now>R.impact+GRACE)resolve('late',null);
      else if(one!=null&&(R.tap.L===null||R.tap.R===null)&&now-one>SYNC+60)resolve('sync',one);
    }
    if(R.resolved&&R.outcome!=='ok'&&!flash&&now>=R.impact){flash={t:now,c:'194,59,44'};sfxCut();if(navigator.vibrate)try{navigator.vibrate([60,40,60])}catch(e){}}
  }
  const pe=clamp(p,0,1);
  VIEW.Z=scale*(1+0.28*pe*pe)*(1+0.03*raise);VIEW.oy=-raise*H*0.025;VIEW.ox=raise*Math.sin(now/22)*3;
  let hilt;
  const cut=imgOk&&IMG2.complete&&IMG2.naturalWidth>0&&R&&R.resolved&&R.outcome!=='ok'&&now>=R.impact;
  if(cut){drawImg(0.12,IMG2);hilt={hx:W/2,hy:H*0.3};}
  else if(imgOk){drawImg(p>0?Math.min(0.5,pe*1.5):0);const h=toScreen(HILT_U,HILT_V);hilt={hx:h.x,hy:h.y};}
  else{bg();hilt={hx:W/2,hy:H*0.36+(scale-1)*H*0.5-raise*H*0.05};}
  dust(now);
  const showBlade=!cut&&(!imgOk||p>0);
  if(showBlade){
    if(R&&R.resolved&&R.outcome==='ok'&&p>=1)blade(1,hilt,handY,'#c9a45c',scale);
    else blade(p,hilt,handY,'#c9a45c',scale);
  }
  hands(handY);
  if(state==='round'&&idx===0&&R&&R.tap.L===null){ctx.fillStyle='rgba(239,230,214,.5)';ctx.font='14px serif';ctx.textAlign='center';
    ctx.fillText(d0?'刀が来たら、つまむ':'左右の親指を、手の位置に置く',W/2,handY+H*HAND_OFF+Math.min(W*0.26,115)*0.64+22);}
  if(state==='result'||state==='end'){ctx.fillStyle='rgba(8,6,5,.62)';ctx.fillRect(0,0,W,H);}
  if(flash){const k=(now-flash.t)/450;if(k<1){ctx.fillStyle=`rgba(${flash.c},${0.55*(1-k)})`;ctx.fillRect(0,0,W,H);
      if(flash.c!=='255,255,255'){ctx.strokeStyle=`rgba(194,59,44,${1-k})`;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(W*0.1,H*0.15);ctx.lineTo(W*0.9,H*0.95);ctx.stroke();}}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
