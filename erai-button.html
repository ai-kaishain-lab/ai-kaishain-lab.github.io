<style>
/* レイアウト: 方眼ノートの1画面。上にほめ言葉、中央に判子ボタン、下にやる気メーターと今日の回数 */
:root {
  /* 共通トークン（lab.css）を、このページで使う名前に割り当てる */
  --paper-local: var(--paper-instrument);
  --sub: var(--ink-muted);
  --card: var(--surface);
  --font-display: var(--font-maru);
  --font-body: var(--font-sans);
  /* 判子の赤は「えらいボタン」だけの例外色 */
  --stamp: #d8362b;
  --stamp-deep: #a92219;
  --stamp-ink: #fff6f3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --stamp: #e9503f; --stamp-deep: #b8301f; }
}
:root[data-theme="dark"] { --stamp: #e9503f; --stamp-deep: #b8301f; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--paper-local);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
main {
  height: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 20px 20px 16px;
  display: grid;
  grid-template-rows: auto auto 1fr auto auto auto auto;
  gap: 20px;
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 12px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 0.04em;
}
.today {
  margin: 0;
  font-size: 14px;
  color: var(--sub);
  font-variant-numeric: tabular-nums;
}
.today strong {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--ink);
  margin: 0 2px;
}

.speech {
  align-self: center;
  background: var(--card);
  border: 2px solid var(--ink);
  border-radius: 14px;
  padding: 20px 18px;
  min-height: 132px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}
.speech::after {
  content: "";
  position: absolute;
  bottom: -11px;
  left: 50%;
  width: 18px;
  height: 18px;
  background: var(--card);
  border-right: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  transform: translateX(-50%) rotate(45deg);
}
#msg {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1.6;
  text-wrap: balance;
  overflow-wrap: anywhere;
  transition: transform .12s ease-out;
}
#msg.t0 { font-size: 20px; }
#msg.t1 { font-size: 26px; }
#msg.t2 { font-size: 22px; transform: rotate(-2deg); }
#msg.t3 { font-size: 18px; transform: rotate(4deg); opacity: .8; }
#msg.t4 { font-size: 15px; transform: rotate(-7deg); opacity: .55; font-weight: 400; font-family: var(--font-body); }

.press-wrap { display: flex; justify-content: center; }
#press {
  width: 196px;
  height: 196px;
  border-radius: 50%;
  border: none;
  background: var(--stamp);
  color: var(--stamp-ink);
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 44px;
  letter-spacing: 0.06em;
  cursor: pointer;
  box-shadow:
    inset 0 0 0 8px var(--stamp),
    inset 0 0 0 11px var(--stamp-ink),
    0 10px 0 var(--stamp-deep);
  transform: translateY(0);
  transition: transform .06s ease-out, box-shadow .06s ease-out;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
#press:active, #press.down {
  transform: translateY(8px);
  box-shadow:
    inset 0 0 0 8px var(--stamp),
    inset 0 0 0 11px var(--stamp-ink),
    0 2px 0 var(--stamp-deep);
}
#press:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }

.meter { display: grid; gap: 6px; }
.meter-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 13px;
  color: var(--sub);
}
.meter-head b {
  font-family: var(--font-display);
  color: var(--ink);
  font-size: 14px;
}
.bar {
  height: 12px;
  border-radius: 6px;
  border: 2px solid var(--ink);
  background: var(--card);
  overflow: hidden;
}
#fill {
  height: 100%;
  width: 100%;
  background: var(--stamp);
  transition: width .25s ease-out;
}
.sound-row { display: flex; justify-content: flex-end; margin-top: -12px; }
#sound {
  border: 2px solid var(--ink);
  background: var(--card);
  color: var(--ink);
  border-radius: 999px;
  font-size: 13px;
  padding: 3px 10px;
  min-width: 8.5em;
  text-align: center;
  cursor: pointer;
  font-family: var(--font-body);
}
.back { margin: 0; text-align: center; font-size: 12px; }
.credit { margin: 4px 0 0; text-align: center; font-size: 11px; color: var(--sub); }
.back a { color: var(--sub); }
@media (prefers-reduced-motion: reduce) {
  #msg, #press, #fill { transition: none; }
}
</style>
</head>

<main>
  <header>
    <h1>えらいボタン</h1>
    <p class="today">今日<strong id="count">0</strong>回ほめられた</p>
  </header>
  <div class="sound-row"><button id="sound" type="button">🔊 女性の声</button></div>

  <div class="speech">
    <p id="msg" class="t0" aria-live="polite">押すと、ほめます。<br>連打すると、ほめ方が雑になります。</p>
  </div>

  <div class="press-wrap">
    <button id="press" type="button" aria-label="ほめてもらう">ほめて</button>
  </div>

  <div class="meter">
    <div class="meter-head">
      <span>ほめ係のやる気</span>
      <b id="mood">ていねい 100%</b>
    </div>
    <div class="bar"><div id="fill"></div></div>
  </div>

  <p class="back"><a href="tools.html">← 会社員のAI実験室の道具箱にもどる</a></p>
  <p class="credit">声：VOICEVOX:四国めたん／VOICEVOX:青山龍星</p>
</main>

    }
  };
  // 右上のボタンで「女性の声 → 男性の声 → 声なし」の順に切り替える
  var MODES = ["female", "male", "off"];
  var MODE_LABEL = { female: "🔊 女性の声", male: "🔊 男性の声", off: "🔇 声なし" };
  var soundBtn = document.getElementById("sound");
  var mode = "female";
  try {
    var saved = localStorage.getItem("erai-sound");
    if (saved === "off" || saved === "male" || saved === "female") mode = saved;
  } catch (e) {}
  var actx = null, buffers = {}, playing = null;
  function renderSound() {
    soundBtn.textContent = MODE_LABEL[mode];
    soundBtn.setAttribute("aria-label", "声の切り替え（いまは" + MODE_LABEL[mode].slice(2) + "）");
  }
  renderSound();
  soundBtn.addEventListener("click", function () {
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    try { localStorage.setItem("erai-sound", mode); } catch (e) {}
    renderSound();
  });
  function initAudio() {
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { actx = new AC(); } catch (e) { return; }
    ["female", "male"].forEach(function (v) {
      Object.keys(VOICE_SRC[v]).forEach(function (k) {
        var bin = atob(VOICE_SRC[v][k].split(",")[1]), u = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        actx.decodeAudioData(u.buffer, function (buf) { buffers[v + "_" + k] = buf; }, function () {});
      });
    });
  }
  function say(clip) {
    if (mode === "off") return;
    var key = mode + "_" + clip;
    initAudio();
    if (!actx) return;
    if (actx.state === "suspended") actx.resume();
    var buf = buffers[key];
    if (!buf) { setTimeout(function () { if (buffers[key] && mode + "_" + clip === key) say(clip); }, 150); return; }
    try { if (playing) playing.stop(); } catch (e) {}
    var src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.start(0);
    playing = src;
  }

  var msgEl = document.getElementById("msg");
  var countEl = document.getElementById("count");
  var moodEl = document.getElementById("mood");
  var fillEl = document.getElementById("fill");
  var btn = document.getElementById("press");

  var fatigue = 0, lastPress = 0, lastMsg = "", tick = null;
  var reverse = 0, thanks = THANKS_PATTERNS[0], lastPattern = -1;

  function todayKey() {
    var d = new Date();
    return "erai-" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function loadCount() {
    try { return parseInt(localStorage.getItem(todayKey()), 10) || 0; } catch (e) { return 0; }
  }
  function saveCount(n) {
    try { localStorage.setItem(todayKey(), String(n)); } catch (e) {}
  }
  var count = loadCount();
  countEl.textContent = count;

  function tierIndex(n) {
    for (var i = 0; i < TIERS.length; i++) if (n <= TIERS[i].upTo) return i;
    return TIERS.length - 1;
  }
  // 手を止めていた時間に応じて、疲れが1段ずつ抜けていく
  function currentFatigue(now) {
    var idle = now - lastPress - GRACE_MS;
    var healed = idle > 0 ? Math.floor(idle / STEP_MS) : 0;
    return Math.max(0, fatigue - healed);
  }
  function motivation(n) {
    if (n <= 0) return 100;
    return Math.max(0, Math.round(100 - (n - 1) * 100 / (LIMIT - 1)));
  }
  function pick(list) {
    var m;
    do { m = list[Math.floor(Math.random() * list.length)]; } while (list.length > 1 && m === lastMsg);
    lastMsg = m;
    return m;
  }
  function showMeter(n) {
    var pct = motivation(n);
    var mood = n <= 0 ? "ていねい" : TIERS[tierIndex(n)].mood;
    moodEl.textContent = mood + " " + pct + "%";
    fillEl.style.width = pct + "%";
  }
  // 休んでいる間、メーターがじわじわ戻る様子を見せる
  function startTick() {
    clearInterval(tick);
    tick = setInterval(function () {
      if (reverse > 0) { clearInterval(tick); return; }
      var f = currentFatigue(Date.now());
      showMeter(f);
      if (f <= 0) clearInterval(tick);
    }, 500);
  }

  function startReverse() {
    clearInterval(tick);
    var i;
    do { i = Math.floor(Math.random() * THANKS_PATTERNS.length); } while (i === lastPattern);
    lastPattern = i;
    thanks = THANKS_PATTERNS[i];
    reverse = 1;
    msgEl.className = "t0";
    msgEl.textContent = BURNOUT[Math.floor(Math.random() * BURNOUT.length)];
    btn.textContent = "えらい";
    btn.setAttribute("aria-label", "ほめ係をほめる");
    moodEl.textContent = "燃えつきた 0%";
    fillEl.style.width = "0%";
  }

  function pressReverse() {
    var i = reverse - 1;
    var pct = Math.round((i + 1) / thanks.length * 100);
    msgEl.className = "t0";
    msgEl.textContent = thanks[i];
    moodEl.textContent = (pct < 100 ? "回復中 " : "ていねい ") + pct + "%";
    fillEl.style.width = pct + "%";
    reverse++;
    say(i === thanks.length - 1 ? "revive" : "ehe");
    if (i === thanks.length - 1) {
      reverse = 0;
      fatigue = 0;
      lastPress = 0;
      btn.textContent = "ほめて";
      btn.setAttribute("aria-label", "ほめてもらう");
    }
  }

  function press() {
    if (reverse > 0) { pressReverse(); return; }
    var now = Date.now();
    var before = fatigue;
    var f = currentFatigue(now);
    var note = "";
    if (before >= 6 && f === 0) note = "（ほめ係が復活しました）";
    else if (before >= 6 && before - f >= 4) note = "（ほめ係、ちょっと回復）";

    fatigue = f + 1;
    lastPress = now;
    count++;
    countEl.textContent = count;
    saveCount(count);

    if (fatigue >= LIMIT) { startReverse(); return; }

    var t = tierIndex(fatigue);
    var list = TIERS[t].msgs;
    if (t === 0) {
      var tm = timeMsgs();
      if (tm.length && Math.random() < 0.35) list = tm;
    }
    msgEl.className = "t" + t;
    msgEl.textContent = note + pick(list);
    showMeter(fatigue);
    say("t" + t);
    startTick();
  }

  btn.addEventListener("click", press);
})();
</script>
