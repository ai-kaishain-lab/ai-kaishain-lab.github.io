<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>モヤモヤ花火｜会社員のAI実験室</title>
<meta name="description" content="吐き出して、スッキリ。イライラ・モヤモヤしたときに、画面をこすったり連打したりして花火にするアプリ。最後は深呼吸でひと息つきます。">
<meta property="og:type" content="website">
<meta property="og:title" content="モヤモヤ花火｜会社員のAI実験室">
<meta property="og:description" content="吐き出して、スッキリ。イライラ・モヤモヤしたときに、画面をこすったり連打したりして花火にするアプリ。最後は深呼吸でひと息つきます。">
<meta property="og:url" content="https://ai-kaishain-lab.github.io/moyamoya-hanabi.html">
<meta property="og:image" content="https://ai-kaishain-lab.github.io/og-moyamoya-hanabi.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d1a;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
    display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none}
  #count{font-size:13px;opacity:.65;letter-spacing:.05em;margin-top:6px}
  .back{pointer-events:auto;color:#fff;opacity:.7;font-size:13px;text-decoration:none}
  .btn{pointer-events:auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;
    border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
  #hint{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;z-index:2;transition:opacity .6s;text-align:center}
  #hint h1{font-size:26px;margin:0 0 10px;font-weight:800}
  #hint p{margin:0;opacity:.7;font-size:15px;line-height:1.7}
  #combo{position:fixed;top:24%;left:0;right:0;text-align:center;font-size:60px;font-weight:900;
    opacity:0;pointer-events:none;z-index:2;transition:opacity .25s;text-shadow:0 0 24px rgba(255,80,160,.8)}
  #combo small{display:block;font-size:16px;font-weight:600;opacity:.8}
  .bottom{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 18px);z-index:3;pointer-events:none}
  #gaugeLabel{font-size:12px;opacity:.6;margin-bottom:6px;display:flex;justify-content:space-between}
  #gauge{height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
  #gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cc9f0,#f72585,#ffd166);transition:width .15s}
  #restBtn{display:block;margin:0 auto 14px;opacity:0;transition:opacity .4s;pointer-events:none}
  #restBtn.show{opacity:1;pointer-events:auto}
  #calm{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 45%,#16324a,#070a14);
    display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  #calm.show{display:flex}
  #breath{position:relative;width:min(84vw,340px);height:min(84vw,340px);margin-bottom:28px}
  #breath > *{position:absolute;left:50%;top:50%;border-radius:50%}
  #guide{width:100%;height:100%;transform:translate(-50%,-50%);border:2px dashed rgba(160,230,255,.35)}
  #circle{width:45%;height:45%;transform:translate(-50%,-50%) scale(1);
    background:radial-gradient(circle at 40% 35%,rgba(200,245,255,.95),rgba(76,201,240,.75) 45%,rgba(40,120,200,.35) 75%);
    box-shadow:0 0 50px 10px rgba(76,201,240,.55),inset 0 0 30px rgba(255,255,255,.35)}
  #circle.out{background:radial-gradient(circle at 40% 35%,rgba(240,225,255,.9),rgba(170,130,255,.7) 45%,rgba(90,60,180,.35) 75%);
    box-shadow:0 0 40px 6px rgba(170,130,255,.5),inset 0 0 30px rgba(255,255,255,.3)}
  #sec{transform:translate(-50%,-50%);font-size:44px;font-weight:800;text-shadow:0 0 12px rgba(0,0,0,.4);pointer-events:none}
  #calmText{font-size:22px;font-weight:700;min-height:32px}
  #calmSub{font-size:14px;opacity:.65;margin-top:8px;min-height:20px;line-height:1.7}
  #calmBtns{margin-top:28px;display:flex;gap:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div><a class="back" href="tools.html">← 道具箱</a><div id="count">0 タップ</div></div>
  <button class="btn" id="soundBtn" aria-label="音の切り替え">🔊 音あり</button>
</div>

<div id="hint">
  <h1>モヤモヤ花火</h1>
  <p style="font-size:18px;font-weight:700;opacity:.9;margin-bottom:10px">吐き出して、スッキリ。</p>
  <p>こすって、連打して。何本の指でもOK。<br>ゲージが満タンになったら、ひと息つきましょう。</p>
</div>

<div id="combo"></div>

<div class="bottom">
  <button class="btn" id="restBtn">🌙 ひと息つく</button>
  <div id="gaugeLabel"><span>発散ゲージ</span><span id="pct">0%</span></div>
  <div id="gauge"><i id="bar"></i></div>
</div>

<div id="calm">
  <div id="breath"><div id="guide"></div><div id="circle"></div><div id="sec"></div></div>
  <div id="calmText">ゆっくり吸って…</div>
  <div id="calmSub"></div>
  <div id="calmBtns">
    <button class="btn" id="againBtn">もう一回発散する</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.fillStyle = '#0b0d1a'; ctx.fillRect(0,0,cv.width,cv.height);
  }
  resize(); addEventListener('resize', resize);

  // ---- state ----
  const MAX = 220;           // ゲージ満タンに必要な量
  const parts = [], rings = [];
  const pointers = new Map();
  let total = 0, energy = 0, combo = 0, maxCombo = 0, lastTap = 0, lastAct = 0;
  let shake = 0, calm = false, finale = false, soundOn = true, started = false;

  const $ = id => document.getElementById(id);
  const countEl = $('count'), comboEl = $('combo'), bar = $('bar'), pct = $('pct');
  const restBtn = $('restBtn'), hint = $('hint');

  // ---- audio ----
  let ac = null, noiseBuf = null;
  function initAudio(){
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const len = ac.sampleRate * 0.6;
        noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch(e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume().catch(()=>{});
  }
  // 出力バス：コンプレッサーで音圧を上げ、短い残響（ディレイ）で広がりを出す
  let bus = null, verbSend = null;
  function getBus(){
    if (bus) return bus;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 6;
    comp.attack.value = 0.002; comp.release.value = 0.12;
    const master = ac.createGain(); master.gain.value = 1.4;
    comp.connect(master).connect(ac.destination);
    const dl = ac.createDelay(0.5), fb = ac.createGain(), lp = ac.createBiquadFilter();
    dl.delayTime.value = 0.11; fb.gain.value = 0.32; lp.type = 'lowpass'; lp.frequency.value = 3500;
    verbSend = ac.createGain(); verbSend.gain.value = 0.35;
    verbSend.connect(dl); dl.connect(lp).connect(fb).connect(dl); lp.connect(comp);
    bus = comp; return bus;
  }
  // コンボが上がるほど音階（ペンタトニック）が上がっていく
  const PENTA = [0, 2, 4, 7, 9];
  function noteFreq(c){
    const i = (c - 1) % 15;
    const semi = PENTA[i % 5] + 12 * Math.floor(i / 5);
    return 523.25 * Math.pow(2, semi / 12);
  }
  function pop(c){
    if (!ac || !soundOn) return;
    const out = getBus(), t = ac.currentTime;
    // ① ドンという胴鳴り（手応え）
    const k = ac.createOscillator(), kg = ac.createGain();
    k.type = 'sine';
    k.frequency.setValueAtTime(190, t);
    k.frequency.exponentialRampToValueAtTime(48, t + 0.13);
    kg.gain.setValueAtTime(0.9, t);
    kg.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    k.connect(kg).connect(out); k.start(t); k.stop(t + 0.2);
    // ② パチンという破裂音（プチプチを潰した感じ）
    const n = ac.createBufferSource(), bp = ac.createBiquadFilter(), ng = ac.createGain();
    n.buffer = noiseBuf; bp.type = 'bandpass';
    bp.frequency.setValueAtTime(2600 + Math.random() * 1400, t); bp.Q.value = 0.9;
    ng.gain.setValueAtTime(0.7, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    n.connect(bp).connect(ng).connect(out);
    n.start(t, Math.random() * 0.5); n.stop(t + 0.07);
    // ③ キラッと鳴る音（コンボで音階が上がる）
    const f = noteFreq(c);
    [[f, 'triangle', 0.32], [f * 2, 'sine', 0.12]].forEach(([fr, type, vol]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(fr * 0.94, t);
      o.frequency.exponentialRampToValueAtTime(fr, t + 0.02);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(out); g.connect(verbSend);
      o.start(t); o.stop(t + 0.37);
    });
  }
  let lastScr = 0;
  function scratch(speed){
    if (!ac || !soundOn) return;
    const now = performance.now();
    if (now - lastScr < 45) return;
    lastScr = now;
    const t = ac.currentTime;
    const n = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = noiseBuf; bp.type = 'bandpass';
    bp.frequency.value = Math.min(600 + speed * 35, 5000); bp.Q.value = 1.2;
    g.gain.setValueAtTime(Math.min(0.3, 0.05 + speed * 0.006), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    n.connect(bp).connect(g).connect(getBus());
    n.start(t, Math.random() * 0.5); n.stop(t + 0.09);
  }
  function chord(){
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i*0.06);
      g.gain.exponentialRampToValueAtTime(0.12, t + i*0.06 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t + i*0.06 + 1.6);
      o.connect(g).connect(ac.destination); o.start(t + i*0.06); o.stop(t + i*0.06 + 1.7);
    });
  }
  function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

  // ---- effects ----
  function addPart(p){ parts.push(p); if (parts.length > 1600) parts.splice(0, parts.length - 1600); }
  function burst(x, y, n, power, baseHue){
    const h = baseHue ?? Math.random() * 360;
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, s = (1 + Math.random() * 4) * power;
      addPart({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1,
        decay: 0.012 + Math.random() * 0.02, size: 2 + Math.random() * 4, h: h + Math.random()*60 - 30});
    }
    rings.push({x, y, r: 6, life: 1, h, w: 2 + power});
  }
  const strokes = [];
  function trail(x0, y0, x, y, speed){
    const h = (performance.now() / 8) % 360;
    // ネオンの帯（速くこするほど太く）
    strokes.push({x0, y0, x, y, w: 6 + Math.min(speed, 60) * 0.5, h, life: 1});
    if (strokes.length > 500) strokes.splice(0, strokes.length - 500);
    // 火花を四方に飛ばす
    const n = Math.min(16, 3 + Math.floor(speed / 3));
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * (3 + speed * 0.12);
      addPart({x: x + (Math.random()-0.5)*8, y: y + (Math.random()-0.5)*8,
        vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1,
        decay: 0.015 + Math.random()*0.02, size: 2 + Math.random()*3.5 + Math.min(speed,50)/10,
        h: h + Math.random()*50 - 25});
    }
  }
  function sparkle(){
    if (!ac || !soundOn) return;
    const out = getBus(), t = ac.currentTime;
    const f = 1500 + Math.random() * 1500;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.08);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); g.connect(out); g.connect(verbSend);
    o.start(t); o.stop(t + 0.27);
  }

  function updateHud(){
    countEl.textContent = total.toLocaleString() + ' タップ';
    const r = Math.min(1, energy / MAX);
    bar.style.width = (r * 100) + '%';
    pct.textContent = Math.floor(r * 100) + '%';
  }

  let comboTimer = 0;
  function showCombo(){
    if (combo < 5) return;
    comboEl.innerHTML = combo + '<small>COMBO</small>';
    comboEl.style.opacity = 1;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => comboEl.style.opacity = 0, 600);
  }

  function act(){
    lastAct = performance.now();
    if (!started){ started = true; hint.style.opacity = 0; }
    restBtn.classList.remove('show');
  }

  function tap(x, y){
    const now = performance.now();
    combo = (now - lastTap < 450) ? combo + 1 : 1;
    maxCombo = Math.max(maxCombo, combo);
    lastTap = now; total++; energy += 1;
    burst(x, y, 14 + Math.min(combo, 30), 1 + Math.min(combo, 40) / 14);
    shake = Math.min(16, 2 + combo * 0.4);
    pop(combo); buzz(8); showCombo(); updateHud(); checkFull();
  }

  function checkFull(){
    if (finale || energy < MAX) return;
    finale = true;
    chord(); buzz([30, 40, 30]);
    let k = 0;
    const iv = setInterval(() => {
      burst(Math.random()*W, Math.random()*H*0.7, 50, 2.6);
      if (++k >= 8){ clearInterval(iv); setTimeout(startCalm, 900); }
    }, 140);
  }

  // ---- pointer input ----
  cv.addEventListener('pointerdown', e => {
    if (calm) return;
    e.preventDefault();
    initAudio(); act();
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    tap(e.clientX, e.clientY);
  }, {passive:false});
  cv.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if (!p || calm) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y, d = Math.hypot(dx, dy);
    if (d < 1) return;
    const x0 = p.x, y0 = p.y;
    p.x = e.clientX; p.y = e.clientY;
    trail(x0, y0, p.x, p.y, d); scratch(d);
    // 一定距離こするごとに小さな爆発
    p.acc = (p.acc || 0) + d;
    if (p.acc >= 130){
      p.acc = 0;
      burst(p.x, p.y, 22, 1.6, (performance.now() / 8) % 360);
      sparkle(); buzz(5);
    }
    energy += Math.min(d, 60) * 0.012;
    shake = Math.max(shake, Math.min(6, d / 10));
    act(); updateHud(); checkFull();
  });
  const end = e => pointers.delete(e.pointerId);
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  // ---- sound toggle ----
  const soundBtn = $('soundBtn');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊 音あり' : '🔇 音なし';
    if (soundOn) initAudio();
  });

  // ---- calm mode (4秒吸う・6秒吐く × 3回) ----
  const calmEl = $('calm'), circle = $('circle'), calmText = $('calmText'), calmSub = $('calmSub'), secEl = $('sec');
  // 呼吸に合わせたやわらかい音（吸う＝音が上がる／吐く＝下がる）
  function breathTone(inhale, ms){
    if (!ac || !soundOn) return;
    const t = ac.currentTime, d = ms / 1000;
    const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = 'sine'; lp.type = 'lowpass'; lp.frequency.value = 900;
    o.frequency.setValueAtTime(inhale ? 196 : 293.66, t);
    o.frequency.linearRampToValueAtTime(inhale ? 293.66 : 196, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.06, t + d * 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + d);
    o.connect(lp).connect(g).connect(ac.destination);
    o.start(t); o.stop(t + d + 0.05);
  }
  let calmTimers = [];
  function startCalm(){
    calm = true; pointers.clear();
    restBtn.classList.remove('show');
    calmEl.classList.add('show');
    calmSub.textContent = '4秒吸って、6秒吐く。3回だけ。';
    const S = 'translate(-50%,-50%) scale(';
    circle.style.transition = 'none'; circle.style.transform = S + '1)';
    circle.classList.remove('out'); secEl.textContent = '';
    const IN = 4000, OUT = 6000, CYCLES = 3, BIG = 2.2;
    // 残り秒数を球の中に表示
    const countdown = (from, start) => {
      for (let s = 0; s < from; s++){
        calmTimers.push(setTimeout(() => { secEl.textContent = from - s; }, start + s * 1000));
      }
    };
    let t = 300;
    for (let c = 0; c < CYCLES; c++){
      calmTimers.push(setTimeout(() => {
        calmText.textContent = 'ゆっくり吸って…';
        circle.classList.remove('out');
        circle.style.transition = `transform ${IN}ms ease-in-out, background 1s, box-shadow 1s`;
        circle.style.transform = S + BIG + ')';
        breathTone(true, IN);
      }, t));
      countdown(4, t);
      t += IN;
      calmTimers.push(setTimeout(() => {
        calmText.textContent = 'ふーっと吐いて…';
        circle.classList.add('out');
        circle.style.transition = `transform ${OUT}ms ease-in-out, background 1s, box-shadow 1s`;
        circle.style.transform = S + '1)';
        breathTone(false, OUT);
      }, t));
      countdown(6, t);
      t += OUT;
    }
    calmTimers.push(setTimeout(() => {
      secEl.textContent = '';
      circle.classList.remove('out');
      calmText.textContent = 'おつかれさまでした';
      calmSub.innerHTML = `今回の発散：${total.toLocaleString()} タップ／最大 ${maxCombo} コンボ<br>少しは軽くなりましたか？`;
    }, t));
  }
  function resetAll(){
    calmTimers.forEach(clearTimeout); calmTimers = [];
    calm = false; finale = false; energy = 0; total = 0; combo = 0; maxCombo = 0;
    parts.length = 0; rings.length = 0; strokes.length = 0;
    calmEl.classList.remove('show');
    updateHud();
  }
  $('againBtn').addEventListener('click', resetAll);
  restBtn.addEventListener('click', () => { if (!finale){ finale = true; startCalm(); } });

  // ---- loop ----
  function loop(){
    const now = performance.now();
    // 手を止めたら「ひと息つく」を出す
    if (!calm && !finale && started && energy > MAX * 0.15 && now - lastAct > 4000 && pointers.size === 0){
      restBtn.classList.add('show');
    }

    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(11,13,26,0.22)';
    ctx.fillRect(0, 0, cv.width, cv.height);

    const sx = (Math.random()-0.5) * shake, sy = (Math.random()-0.5) * shake;
    shake *= 0.86;
    ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
    ctx.globalCompositeOperation = 'lighter';

    ctx.lineCap = 'round';
    for (let i = strokes.length - 1; i >= 0; i--){
      const s = strokes[i];
      s.life -= 0.03;
      if (s.life <= 0){ strokes.splice(i, 1); continue; }
      ctx.strokeStyle = `hsla(${s.h},100%,60%,${s.life * 0.25})`;
      ctx.lineWidth = s.w * 2.4 * s.life;
      ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x, s.y); ctx.stroke();
      ctx.strokeStyle = `hsla(${s.h},100%,75%,${s.life * 0.9})`;
      ctx.lineWidth = s.w * 0.6 * s.life;
      ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy = p.vy * 0.96 + 0.05;
      p.life -= p.decay;
      if (p.life <= 0){ parts.splice(i, 1); continue; }
      ctx.fillStyle = `hsla(${p.h},95%,62%,${p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life + 0.5, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = rings.length - 1; i >= 0; i--){
      const r = rings[i];
      r.r += 5 + (1 - r.life) * 4; r.life -= 0.035;
      if (r.life <= 0){ rings.splice(i, 1); continue; }
      ctx.strokeStyle = `hsla(${r.h},95%,70%,${r.life * 0.8})`;
      ctx.lineWidth = r.w * r.life;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }
    requestAnimationFrame(loop);
  }
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
